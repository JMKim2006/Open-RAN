name: public-stack-experiment
on: workflow_dispatch
jobs:
  experiment:
    runs-on: [self-hosted, linux, x64, sctp, docker]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/run-experiment.sh evidence/run
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orqest-evidence
          path: |
            evidence/run/*.pcap
            evidence/run/logs
            evidence/run/summary.txt
            evidence/run/commits.txt
            evidence/run/dirty-trees.txt
            evidence/run/SHA256SUMS
