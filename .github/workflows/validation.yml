name: hosted-validation

on:
  push:
    branches: [agent/orqest-public-stack-validation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capability-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe hosted runner
        id: probe
        continue-on-error: true
        run: scripts/capability-probe.sh evidence/capability
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capability-probe
          path: evidence/capability
          if-no-files-found: error
      - if: steps.probe.outcome != 'success'
        run: exit 1

  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_posix_paths.py
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python3 tools/validate_contract.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  hosted-minimal-e2:
    needs: [capability-probe, portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        id: ccache
        with:
          path: ~/.cache/ccache
          key: hosted-e2-ccache-${{ runner.os }}-${{ hashFiles('integration/pins.env', 'scripts/build-hosted-minimal.sh') }}
          restore-keys: hosted-e2-ccache-${{ runner.os }}-
      - name: Build and run pinned OCUDU/FlexRIC no-RF experiment
        id: experiment
        continue-on-error: true
        env:
          CCACHE_MAXSIZE: 5G
        run: scripts/run-hosted-minimal-e2.sh evidence/hosted-minimal-e2
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-minimal-e2-evidence
          path: evidence/hosted-minimal-e2
          if-no-files-found: error
      - if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: hosted-e2-ccache-${{ runner.os }}-${{ hashFiles('integration/pins.env', 'scripts/build-hosted-minimal.sh') }}
      - if: steps.experiment.outcome != 'success'
        run: exit 1

  hosted-evidence-summary:
    if: always()
    needs: hosted-minimal-e2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hosted-minimal-e2-evidence
          path: evidence
      - name: Print bounded evidence summary
        shell: bash
        run: |
          set -u
          for file in evidence/evidence.json evidence/gate-a.json \
            evidence/run-metadata.txt evidence/commits.txt evidence/dirty-trees.txt; do
            echo "::group::$file"
            if [[ -f "$file" ]]; then
              sed -n '1,200p' "$file"
            else
              echo "missing"
            fi
            echo "::endgroup::"
          done
          for file in evidence/logs/ocudu.log evidence/logs/ocudu-file.log \
            evidence/logs/flexric.log evidence/logs/kpm-xapp.log \
            evidence/logs/tcpdump.log; do
            echo "::group::$file (last 120 lines)"
            if [[ -f "$file" ]]; then
              tail -n 120 "$file"
            else
              echo "missing"
            fi
            echo "::endgroup::"
          done
          if [[ -f evidence/e2ap.pcap ]]; then
            stat --printf='evidence/e2ap.pcap bytes=%s\n' evidence/e2ap.pcap
          else
            echo "evidence/e2ap.pcap missing"
          fi

  orqest-overlay:
    needs: hosted-minimal-e2
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Apply overlay and run Gate B
        id: overlay
        continue-on-error: true
        run: scripts/run-hosted-overlay.sh evidence/hosted-overlay
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-orqest-overlay-evidence
          path: evidence/hosted-overlay
          if-no-files-found: error
      - if: steps.overlay.outcome != 'success'
        run: exit 1
