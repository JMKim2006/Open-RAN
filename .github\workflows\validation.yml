name: validation
on: [push, pull_request]
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -G Ninja && cmake --build build && ctest --test-dir build --output-on-failure
      - run: python3 tools/validate_contract.py
  public-stack:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, sctp, docker]
    steps:
      - uses: actions/checkout@v4
      - run: scripts/run-experiment.sh evidence/run
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: public-stack-evidence, path: evidence/run}
